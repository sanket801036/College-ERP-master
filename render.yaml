# No `databases:` block. Render's free Postgres expires 30 days after it is
# created and then gets deleted, backups are not offered on it, and a demo that
# quietly dies a month after the interview link goes out is worse than no demo.
# The database is Neon instead - free tier, no expiry - and it reaches this
# service the same way any other secret does, through DATABASE_URL below.

services:
  - type: web
    name: college-erp
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn CollegeERP.wsgi:application"
    envVars:
      # sync:false rather than fromDatabase: the connection string belongs to
      # a database this blueprint does not own, and it is a password, so it
      # cannot live in the repository. Render asks for it on a new blueprint;
      # on a service that already exists it has to be pasted in once, under
      # Environment.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: PYTHON_VERSION
        value: 3.10.11
      # Mail. Without these the app falls back to printing messages to the
      # log, so a deploy without them still works - the password reset just
      # cannot reach anybody. Host and port are Gmail's and are not secret;
      # the account and its app password are marked sync:false, which means
      # Render asks for the value and stores it, and it never enters git.
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Uploads. This disk does not survive a deploy, so without these the
      # profile photos and leave certificates are gone every time the service
      # restarts. All five are sync:false: the bucket and region are not
      # secret, but they belong to whoever deployed this rather than to the
      # repository, and an existing service is not given sync:false values
      # retrospectively - they are added by hand in the dashboard once.
      #
      # Set for Backblaze B2 in this deployment; the endpoint is what makes it
      # any S3-compatible provider rather than AWS specifically.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
