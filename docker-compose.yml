# Local development: `docker compose up` and the app is on :8000 with its own
# Postgres. Previously a new contributor had to install and configure Postgres
# by hand before anything would run.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: college_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The web container starts before Postgres is ready to accept connections
    # without this, and the first migrate fails.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: college_erp
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: dev-only-not-a-real-secret
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    # Migrate on boot and seed an empty database, so the first run lands on a
    # working app rather than a login page with no accounts behind it.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Source mounted for reload during development. The image still contains
      # the code, so it runs standalone without this.
      - .:/app

volumes:
  pgdata:
