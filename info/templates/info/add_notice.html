{% extends 'info/base.html' %}
{% load static %}

{% block title %}Post Notice{% endblock %}

{% block content %}

<div class="card mb-3 mx-auto" style="max-width: 560px;">
  <div class="card-header"><i class="fas fa-bullhorn"></i><b>Post a Notice</b></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea name="message" class="form-control" rows="4" required></textarea>
      </div>
      <div class="form-group">
        <label>Audience</label>
        <select name="audience" class="form-control" required>
          <option value="All">Everyone</option>
          <option value="Students">Students only</option>
          <option value="Teachers">Teachers only</option>
        </select>
      </div>
      <button class="btn btn-primary" type="submit">Post</button>
      <a class="btn btn-secondary" href="{% url 'notices' %}">Cancel</a>
    </form>
  </div>
</div>

{% endblock %}
