{% extends 'info/base.html' %}

{% block title %}Password changed{% endblock %}

{% block content %}
<div class="card mb-3 mx-auto" style="max-width: 520px;">
  <div class="card-header"><i class="fas fa-check-circle"></i><b>Password changed</b></div>
  <div class="card-body">
    <p>Your new password is in effect. Use it the next time you sign in.</p>
    <a class="btn btn-primary" href="{% url 'index' %}">Back to dashboard</a>
  </div>
</div>
{% endblock %}
