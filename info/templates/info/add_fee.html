{% extends 'info/base.html' %}
{% load static %}

{% block title %}Add Fee{% endblock %}

{% block content %}

<div class="card mb-3 mx-auto" style="max-width: 560px;">
  <div class="card-header"><i class="fas fa-plus"></i><b>Add Fee Record</b></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Student</label>
        <select name="student" class="form-control" required>
          {% for s in all_students %}
            <option value="{{ s.USN }}">{{ s.name }} ({{ s.USN }}) - {{ s.class_id }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Fee Type</label>
        <select name="fee_type" class="form-control" required>
          {% for value, label in fee_types %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Description (optional)</label>
        <input type="text" name="description" class="form-control">
      </div>
      <div class="form-group">
        <label>Amount</label>
        <input type="number" step="0.01" min="0" name="amount" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Paid Amount</label>
        <input type="number" step="0.01" min="0" name="paid_amount" class="form-control" value="0">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" name="due_date" class="form-control" required>
      </div>
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-secondary" href="{% url 't_fees' %}">Cancel</a>
    </form>
  </div>
</div>

{% endblock %}
