<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Login · College ERP</title>

      {% load static %}

    <!-- Bootstrap core CSS-->
    <link href="{% static '/info/bootstrap/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Custom fonts for this template-->
    <link href="{% static '/info/bootstrap/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">

    <!-- Custom styles for this template-->
    <link href="{% static '/info/bootstrap/css/sb-admin.css' %}" rel="stylesheet">

    <!-- Modern theme overlay -->
    <link href="{% static '/info/css/theme.css' %}" rel="stylesheet">

  </head>

  <body>

    <div class="erp-login-page">
      <div class="erp-login-card">
        <div class="erp-login-logo"><i class="fas fa-graduation-cap"></i></div>
        <h4 class="text-center mb-1">College ERP</h4>
        <p class="text-center text-muted small mb-4">Sign in to continue</p>

        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Invalid username or password. Please try again.</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label class="small text-muted">Username</label>
            {{ form.username }}
          </div>
          <div class="form-group">
            <label class="small text-muted">Password</label>
            {{ form.password }}
          </div>
          <button class="btn btn-primary mt-2" type="submit"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
      </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="{% static '/info/bootstrap/vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static '/info/bootstrap/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static '/info/bootstrap/vendor/jquery-easing/jquery.easing.min.js' %}"></script>

  </body>

</html>
