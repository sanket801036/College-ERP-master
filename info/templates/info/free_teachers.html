{% extends 'info/base.html' %}
{% load static %}

{% block title %}Free Teachers{% endblock %}

{% block content %}

<div class="card mb-3">
  <div class="card-header"><i class="fas fa-user-check"></i><b>Free Teachers</b></div>
  <div class="card-body">
    <ul class="list-group">
      {% for t in ft_list %}
        <li class="list-group-item d-flex align-items-center">
          <span class="erp-badge erp-badge-success mr-2">Free</span> {{ t }}
        </li>
      {% empty %}
        <li class="list-group-item text-muted">No free teachers for this slot.</li>
      {% endfor %}
    </ul>
  </div>
</div>

{% endblock %}
