{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Error{% endblock %} &middot; College ERP</title>
  <link href="{% static '/info/bootstrap/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static '/info/bootstrap/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
  <link href="{% static '/info/css/theme.css' %}" rel="stylesheet">
</head>
<body>
  <div class="erp-login-page">
    <div class="erp-login-card text-center">
      <div class="erp-login-logo">
        <i class="fas {% block icon %}fa-exclamation-triangle{% endblock %}"></i>
      </div>
      <h1 class="h4 mb-2">{% block heading %}Something went wrong{% endblock %}</h1>
      <p class="text-muted mb-4">{% block message %}{% endblock %}</p>
      <a class="btn btn-primary" href="/">Back to dashboard</a>
    </div>
  </div>
</body>
</html>
